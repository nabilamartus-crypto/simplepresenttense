    <!-- AUDIO EFFECTS USING WEB AUDIO API -->
    <script>
        // Sound FX Generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Text To Speech Helper
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>

                            ${adverbsList.map(adv => `
                                <div class="bg-white p-2 rounded-lg border border-emerald-200 text-center shadow-sm">
                                    <p class="font-bold text-emerald-800 text-xs">${adv.en}</p>
                                    <p class="text-[10px] text-gray-500 font-sans italic">${adv.id}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Vocabulary List Interactive -->
                    <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl">
                        <h4 class="font-bold text-gray-800 mb-2 flex items-center justify-between">
                            <span>🔤 Daftar Kosakata & Contoh Kalimat (Klik untuk Suara 🔊)</span>
                        </h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${vocabularyList.map(v => `
                                <div onclick="speakText('${v.en}. ${v.example}'); playSound('click')" 
                                    class="bg-white p-3 rounded-xl border border-gray-200 hover:border-indigo-400 cursor-pointer transition shadow-sm space-y-1">
                                    <div class="flex justify-between items-center">
                                        <p class="font-bold text-indigo-900 text-sm">${v.en} <span class="text-xs font-normal text-gray-500 font-sans">(${v.id})</span></p>
                                        <i class="fa-solid fa-volume-high text-indigo-400 text-xs"></i>
                                    </div>
                                    <p class="text-xs font-semibold text-gray-700 font-sans">" ${v.example} "</p>
                                    <p class="text-[11px] text-gray-500 italic font-sans">Arti: ${v.exampleId}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. LATIHAN SOAL (5 SOAL)
        let practiceIndex = 0;
        let practiceScore = 0;

        function startPractice() {
            playSound('click');
            practiceIndex = 0;
            practiceScore = 0;
            renderPracticeQuestion();
        }

        function renderPracticeQuestion() {
            const q = practiceQuestions[practiceIndex];
            const main = document.getElementById('main-content');
            
            main.innerHTML = `
                <div class="space-y-6">
                    <!-- Top Bar -->
                    <div class="flex justify-between items-center">
                        <span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full font-bold text-xs">
                            Latihan Soal ${practiceIndex + 1} dari ${practiceQuestions.length}
                        </span>
                        <button onclick="showMainMenu(); playSound('click')" class="text-xs text-gray-500 hover:underline">
                            Kembali ke Menu
                        </button>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${((practiceIndex) / practiceQuestions.length) * 100}%"></div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-white p-6 rounded-2xl border-2 border-emerald-100 shadow-sm text-center">
                        <h3 class="text-xl font-bold text-gray-800 mb-6 font-sans">${q.question}</h3>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="practice-options">
                            ${q.options.map((opt, i) => `
                                <button onclick="checkPracticeAnswer(${i})" 
                                    class="p-4 rounded-xl border-2 border-gray-200 hover:border-emerald-500 hover:bg-emerald-50 text-left font-bold text-gray-700 transition bounce-hover btn-shadow flex items-center justify-between">
                                    <span>${opt}</span>
                                    <span class="w-6 h-6 rounded-full border text-xs flex items-center justify-center text-gray-400">${String.fromCharCode(65 + i)}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Feedback Area -->
                    <div id="practice-feedback" class="hidden p-4 rounded-xl text-sm font-sans border"></div>
                </div>
            `;
        }

        function checkPracticeAnswer(selected) {
            const q = practiceQuestions[practiceIndex];
            const feedbackEl = document.getElementById('practice-feedback');
            const optionsEl = document.getElementById('practice-options');
            
            // Disable buttons
            Array.from(optionsEl.children).forEach(btn => btn.disabled = true);

            if (selected === q.correct) {
                playSound('correct');
                practiceScore++;
                feedbackEl.className = "p-4 rounded-xl text-sm font-sans border bg-green-50 border-green-200 text-green-800 space-y-2 block";
                feedbackEl.innerHTML = `
                    <p class="font-bold text-base flex items-center gap-2">
                        <span>🎉 Jawaban Benar!</span>
                    </p>
                    <p>${q.explanation}</p>
                    <button onclick="nextPractice()" class="mt-2 px-4 py-2 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700">Lanjut <i class="fa-solid fa-arrow-right ml-1"></i></button>
                `;
            } else {
                playSound('wrong');
                feedbackEl.className = "p-4 rounded-xl text-sm font-sans border bg-red-50 border-red-200 text-red-800 space-y-2 block";
                feedbackEl.innerHTML = `
                    <p class="font-bold text-base flex items-center gap-2">
                        <span>❌ Kurang Tepat!</span>
                    </p>
                    <p>Jawaban yang benar adalah: <b>${q.options[q.correct]}</b></p>
                    <p>${q.explanation}</p>
                    <button onclick="nextPractice()" class="mt-2 px-4 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700">Lanjut <i class="fa-solid fa-arrow-right ml-1"></i></button>
                `;
            }
        }

        function nextPractice() {
            playSound('click');
            practiceIndex++;
            if (practiceIndex < practiceQuestions.length) {
                renderPracticeQuestion();
            } else {
                currentUser.practiceDone = true; // Mark practice done
                showPracticeResult();
            }
        }

        function showPracticeResult() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="text-center space-y-6 max-w-md mx-auto">
                    <div class="text-5xl">🌟</div>
                    <h2 class="text-2xl font-bold text-indigo-900">Latihan Selesai!</h2>
                    <p class="text-gray-600 font-sans">Kamu telah menyelesaikan seluruh soal latihan. Sekarang menu <b>Tes Evaluasi</b> telah terbuka!</p>
                    
                    <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-200">
                        <p class="text-sm text-emerald-800 font-sans font-semibold">Skor Latihan Kamu:</p>
                        <p class="text-4xl font-extrabold text-emerald-600 my-2">${(practiceScore / practiceQuestions.length) * 100}</p>
                        <p class="text-xs text-emerald-700">${practiceScore} dari ${practiceQuestions.length} soal dijawab dengan benar.</p>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="startPractice()" class="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300">Ulangi Latihan</button>
                        <button onclick="showMainMenu()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700">Menu Utama</button>
                    </div>
                </div>
            `;
        }

        // 5. TES EVALUASI (15 SOAL PILIHAN GANDA DENGAN PEMBAHASAN SIKAP JAWAB)
        let testIndex = 0;
        let testUserAnswers = [];
        let shuffledTestQuestions = [];

        function startTest() {
            playSound('click');
            testIndex = 0;
            testUserAnswers = [];
            // Shallow clone and shuffle
            shuffledTestQuestions = [...testQuestionsBank].sort(() => Math.random() - 0.5);
            renderTestQuestion();
        }

        function renderTestQuestion() {
            const q = shuffledTestQuestions[testIndex];
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <div class="space-y-5">
                    <!-- Header -->
                    <div class="flex justify-between items-center border-b pb-3">
                        <span class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full font-bold text-xs">
                            Tes Evaluasi: Soal ${testIndex + 1} / ${shuffledTestQuestions.length}
                        </span>
                        <span class="text-xs text-gray-400 font-sans">Pilih 1 jawaban paling tepat</span>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                        <div class="bg-purple-600 h-full transition-all duration-300" style="width: ${((testIndex) / shuffledTestQuestions.length) * 100}%"></div>
                    </div>

                    <!-- Question Box -->
                    <div class="bg-white p-6 rounded-2xl border-2 border-purple-100 shadow-sm">
                        <h3 class="text-lg sm:text-xl font-bold text-gray-800 mb-6 font-sans">
                            ${testIndex + 1}. ${q.q}
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="test-options">
                            ${q.options.map((opt, i) => `
                                <button onclick="selectTestAnswer(${i})" 
                                    class="p-4 rounded-xl border-2 border-gray-200 hover:border-purple-500 hover:bg-purple-50 text-left font-bold text-gray-700 transition bounce-hover btn-shadow flex items-center justify-between">
                                    <span><b>${String.fromCharCode(65 + i)}.</b> ${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Test Feedback & Discussion Box -->
                    <div id="test-feedback" class="hidden p-4 rounded-xl text-sm font-sans border"></div>
                </div>
            `;
        }

        function selectTestAnswer(ansIndex) {
            const q = shuffledTestQuestions[testIndex];
            const feedbackEl = document.getElementById('test-feedback');
            const optionsEl = document.getElementById('test-options');

            // Disable option buttons
            Array.from(optionsEl.children).forEach(btn => btn.disabled = true);

            const isCorrect = (ansIndex === q.answer);

            testUserAnswers.push({
                question: q.q,
                selected: ansIndex,
                correct: q.answer
            });

            if (isCorrect) {
                playSound('correct');
                feedbackEl.className = "p-4 rounded-xl text-sm font-sans border bg-green-50 border-green-200 text-green-900 space-y-2 block";
                feedbackEl.innerHTML = `
                    <p class="font-bold text-base text-green-700 flex items-center gap-1">
                        <span>🎉 Jawaban Kamu Benar!</span>
                    </p>
                    <p><b>Pembahasan:</b> ${q.explanation}</p>
                    <button onclick="nextTestQuestion()" class="mt-2 px-4 py-2 bg-purple-600 text-white font-bold rounded-lg hover:bg-purple-700">
                        Soal Berikutnya <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                `;
            } else {
                playSound('wrong');
                feedbackEl.className = "p-4 rounded-xl text-sm font-sans border bg-red-50 border-red-200 text-red-900 space-y-2 block";
                feedbackEl.innerHTML = `
                    <p class="font-bold text-base text-red-700 flex items-center gap-1">
                        <span>❌ Jawaban Kamu Kurang Tepat!</span>
                    </p>
                    <p>Jawaban yang benar: <b>${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}</b></p>
                    <p><b>Pembahasan:</b> ${q.explanation}</p>
                    <button onclick="nextTestQuestion()" class="mt-2 px-4 py-2 bg-purple-600 text-white font-bold rounded-lg hover:bg-purple-700">
                        Soal Berikutnya <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                `;
            }
        }

        function nextTestQuestion() {
            playSound('click');
            testIndex++;

            if (testIndex < shuffledTestQuestions.length) {
                renderTestQuestion();
            } else {
                finishTest();
            }
        }

        function finishTest() {
            // Calculate Score
            let correctCount = 0;
            testUserAnswers.forEach(ans => {
                if (ans.selected === ans.correct) correctCount++;
            });

            const finalScore = Math.round((correctCount / shuffledTestQuestions.length) * 100);
            currentUser.lastScore = finalScore;
            currentUser.testDone = true;

            // Trigger Confetti Celebration at the end of the test
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 60,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 300);

            renderTestResult(correctCount, finalScore);
        }

        function renderTestResult(correctCount, finalScore) {
            const main = document.getElementById('main-content');
            
            // Custom Badge Message
            let badge = "🥇 Hebat Sekali! Luar Biasa!";
            let badgeBg = "bg-yellow-100 text-yellow-800 border-yellow-300";
            if (finalScore < 70) {
                badge = "📚 Tetap Semangat Belajar Ya!";
                badgeBg = "bg-blue-100 text-blue-800 border-blue-300";
            }

            main.innerHTML = `
                <div class="text-center space-y-5 max-w-lg mx-auto">
                    <div class="inline-block px-4 py-1.5 rounded-full border font-bold text-sm ${badgeBg}">
                        ${badge}
                    </div>

                    <h2 class="text-2xl font-extrabold text-indigo-900">Hasil Tes Evaluasi</h2>
                    
                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-6 rounded-3xl border-2 border-indigo-100 shadow-sm space-y-3">
                        <p class="text-sm text-gray-500 font-sans">Nilai Akhir Kamu:</p>
                        <div class="text-6xl font-black text-indigo-600 tracking-tight">
                            ${finalScore}
                        </div>
                        <p class="text-xs text-gray-600 font-sans font-semibold">
                            Benar ${correctCount} dari ${shuffledTestQuestions.length} Soal
                        </p>
                    </div>

                    <!-- Tombol WA Guru (Kirim Nilai) -->
                    <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200 text-left space-y-2">
                        <div class="flex items-center space-x-2 text-emerald-800 font-bold text-sm">
                            <i class="fa-brands fa-whatsapp text-lg text-emerald-600"></i>
                            <span>Lapor Hasil Ke Guru</span>
                        </div>
                        <p class="text-xs text-emerald-700 font-sans">
                            Klik tombol di bawah untuk mengonfirmasi dan mengirimkan rekap hasil tes ini langsung ke WhatsApp Guru.
                        </p>
                        <button onclick="sendToWhatsApp(${finalScore}, ${correctCount})" 
                            class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition bounce-hover flex items-center justify-center space-x-2 text-sm btn-shadow">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            <span>Kirim Konfirmasi Hasil ke WA Guru</span>
                        </button>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="startTest()" class="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 text-sm">
                            Ulangi Tes
                        </button>
                        <button onclick="showMainMenu()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 text-sm">
                            Menu Utama
                        </button>
                    </div>
                </div>
            `;
        }

        // Send WhatsApp Confirmation
        function sendToWhatsApp(score, correctCount) {
            playSound('click');
            const message = `Assalamu'alaikum / Selamat Hari Ibu/Bapak Guru,\n\nSaya telah selesai mengerjakan Tes Evaluasi pembelajaran Bahasa Inggris (Simple Present Tense - Kalimat Positif):\n\n👤 *Nama Lengkap*: ${currentUser.name}\n🏫 *Kelas*: ${currentUser.class}\n📍 *Sekolah*: SDN 135 Tanjung Jabung Barat\n\n📊 *HASIL EVALUASI*:\n- Jumlah Soal: ${shuffledTestQuestions.length}\n- Benar: ${correctCount}\n- *Nilai Akhir: ${score}*\n\nTerima kasih Banyak! 🙏`;

            const encodedText = encodeURIComponent(message);
            // Form WhatsApp link without showing phone number directly on user view
            const waUrl = `https://wa.me/62${TEACHER_PHONE.substring(1)}?text=${encodedText}`;

            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
